[project]
name = "langstats"
version = "0.5.0"
description = "Language stats for Claude Code"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.urls]
Homepage = "https://codecruz.github.io/langstats/"
Repository = "https://github.com/codecruz/langstats"
Changelog = "https://github.com/codecruz/langstats/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["UP031", "SIM105", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["langstats", "conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
