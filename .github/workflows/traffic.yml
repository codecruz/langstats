name: Traffic

# GitHub keeps only 14 days of clone and view counts. Every day, merge them into
# traffic.csv on the `traffic` branch so the history goes further back.
# Needs the TRAFFIC_TOKEN secret: a fine-grained token for this repository with
# "Administration: Read-only" (the default token cannot read traffic).

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check out the traffic branch
        run: |
          if git ls-remote --exit-code --heads origin traffic >/dev/null; then
            git fetch --depth=1 origin traffic
            git worktree add data FETCH_HEAD
          else
            git worktree add --detach data
            git -C data checkout --orphan traffic
            git -C data rm -rfq .
          fi

      - name: Merge the last 14 days
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python3 tools/traffic.py "$GITHUB_REPOSITORY" data/traffic.csv

      - name: Commit
        working-directory: data
        run: |
          git add traffic.csv
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "traffic: $(date -u +%F)"
          git push origin HEAD:traffic
